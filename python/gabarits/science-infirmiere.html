<!DOCTYPE html>
<html lang="{{ langue }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titre }}</title>
  <style>
    :root {
      --texte: #1f2328;
      --fond: #ffffff;
      --accent: #0b5394;
      --gris: #6a737d;
      --bordure: #d9dde3;
    }
    body {
      margin: 0;
      padding: 2rem 1rem;
      background: var(--fond);
      color: var(--texte);
      font: 1.05rem/1.6 Georgia, "Times New Roman", serif;
    }
    main { max-width: 46rem; margin: 0 auto; overflow-wrap: break-word; }
    h1, h2, h3, h4 { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.25; }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.5rem; border-bottom: 1px solid var(--bordure); padding-bottom: .25rem; margin-top: 2.5rem; }
    h3 { font-size: 1.2rem; margin-top: 2rem; }
    h1.titre-document { color: var(--accent); }
    p.sous-titre { color: var(--gris); font-size: 1.15rem; margin-top: -.5rem; }
    blockquote { margin: 1.5rem 0 1.5rem 2.5rem; text-align: justify; hyphens: auto; }
    figcaption { margin: 1rem 0; }
    img { max-width: 100%; height: auto; }
    table { border-collapse: collapse; margin: 1.5rem 0; width: 100%; }
    td, th { padding: .4rem .6rem; vertical-align: top; }
    div.resume { background: #f4f6f8; padding: 1rem 1.25rem; border-radius: 4px; }
    nav.table-des-matieres { background: #f4f6f8; padding: 1rem 1.5rem; border-radius: 4px; margin-bottom: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: .95rem; }
    nav.table-des-matieres .tdm-titre { font-weight: bold; margin: 0 0 .5rem; }
    nav.table-des-matieres ol { padding-left: 1.25rem; margin: 0; }
    nav.table-des-matieres a { color: var(--accent); text-decoration: none; }
    nav.table-des-matieres a:hover { text-decoration: underline; }

    /* Mise en page des articles de revue */
    h1, h2 { text-align: center; }
    main > p { text-align: justify; hyphens: auto; }
    p.bandeau { background: #1f3864; color: #fff; padding: .3rem .6rem; text-align: left;
      font-family: Arial, Helvetica, sans-serif; }
    footer.pied-page { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid var(--bordure);
      color: var(--gris); font: .85rem/1.4 Arial, Helvetica, sans-serif; }
    footer.pied-page p { display: flex; align-items: center; gap: .5rem; margin: .25rem 0; }
    footer.pied-page span:last-child:not(:first-child) { margin-left: auto; white-space: nowrap; }
    footer.pied-page img { height: 1.6rem; vertical-align: middle; }
    /* Tableaux au format APA, 7e édition : filets horizontaux en haut, sous l'entête et en bas,
       aucune bordure verticale, entêtes centrés en maigre. La largeur des colonnes suit le contenu. */
    table { border-top: 1.5px solid var(--texte); border-bottom: 1.5px solid var(--texte); }
    td, th { font-size: .9rem; padding: .3rem .4rem; overflow-wrap: break-word; }
    th { font-weight: normal; text-align: center; vertical-align: bottom; border-bottom: 1px solid var(--texte); }
    p.note-tableau { font-size: .9rem; text-align: left; margin: .25rem 0; }
    table + p.note-tableau, div.tableau-large + p.note-tableau { margin-top: -1.1rem; }
    /* Tableau large : il garde des colonnes lisibles et défile dans sa zone, pas avec la page */
    div.tableau-large { overflow-x: auto; margin: 1.5rem 0; }
    div.tableau-large:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    div.tableau-large table { margin: 0; }
    div.tableau-large td, div.tableau-large th { min-width: 5.5rem; }
    td p, th p { margin: 0; }
    td p + p, th p + p { margin-top: .35rem; }
  </style>
</head>
<body>
<main>
{{ tdm }}
{{ contenu }}
{{ pied }}
</main>
</body>
</html>
